:root{--bg:#f5f7fa;--card:#fff;--ink:#1d2433;--mut:#9aa3b2;--line:#e3e7ee;--acc:#2563eb;--diff:#fff6db}

.vend button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:12px}.vend button:hover{color:#c00}
.cb{position:relative}.cb input{width:100%}.list{position:absolute;top:100%;left:0;right:0;max-height:280px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #0002;z-index:20;display:none;font-weight:400}
.list div{padding:7px 10px;cursor:pointer}.list div:hover,.list div.on{background:#eef3ff}.none{color:var(--mut);font-style:italic;font-weight:400}
tr.diff td{background:var(--diff)}tr.diff td.attr{background:#fbefc6}.m{color:var(--mut)}.cnt{font-size:12px;color:var(--mut);font-weight:400}
body.donly tr.same{display:none}footer{padding:16px;text-align:center;color:#667;font-size:12px}
